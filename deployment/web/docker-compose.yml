services:
  dp-yunexpress-web:
    build:
      context: ../..
      dockerfile: deployment/web/Dockerfile
    container_name: dp-yunexpress-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DP_WEB_DATA_DIR: /data
      DP_WEB_COOKIE_SECURE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - dp_yunexpress_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

volumes:
  dp_yunexpress_data:
